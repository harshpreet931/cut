[project]
name = "cut"
version = "0.1.0"
description = "An editor that can't write. It can only cut."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "laya==0.3.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
cut = "cut.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cut"]
